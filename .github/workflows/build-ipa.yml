
name: Build BMW Phone Key IPA

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-15-intel

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Build application
        run: |
          xcodebuild \
            -project BMWPhoneKey.xcodeproj \
            -scheme BMWPhoneKey \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            build

      - name: Package IPA
        run: |
          mkdir -p Payload
          cp -R build/Build/Products/Release-iphoneos/BMWPhoneKey.app Payload/
          zip -r BMWPhoneKey-unsigned.ipa Payload

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: BMWPhoneKey-IPA
          path: BMWPhoneKey-unsigned.ipa
