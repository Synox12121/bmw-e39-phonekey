
name: BMWPhoneKey

options:
  bundleIdPrefix: com.bmwe39.test

settings:
  base:
    IPHONEOS_DEPLOYMENT_TARGET: '16.0'
    SWIFT_VERSION: '5.0'

targets:
  BMWPhoneKey:
    type: application
    platform: iOS
    sources:
      - Sources

    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.bmwe39.test.phonekey
        TARGETED_DEVICE_FAMILY: '1'
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_NSBluetoothAlwaysUsageDescription: "BMW E39 cihazina Bluetooth ile baglanmak icin izin gereklidir."
        CODE_SIGNING_ALLOWED: NO

    info:
      path: GeneratedInfo.plist
      properties:
        NSBluetoothAlwaysUsageDescription: "BMW E39 cihazina Bluetooth ile baglanmak icin izin gereklidir."
        UIBackgroundModes:
          - bluetooth-central
