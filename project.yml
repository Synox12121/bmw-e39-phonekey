name: BMWPhoneKey
options:
  bundleIdPrefix: com.bmwe39.test
settings:
  base:
    IPHONEOS_DEPLOYMENT_TARGET: '16.0'
    SWIFT_VERSION: '5.0'
targets:
  BMWPhoneKey:
    type: application
    platform: iOS
    sources: [Sources]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.bmwe39.test.phonekey
        TARGETED_DEVICE_FAMILY: '1'
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_NS_BLUETOOTH_ALWAYS_USAGE_DESCRIPTION: 'BMW E39 test cihazina BLE uzerinden baglanmak icin Bluetooth gereklidir.'
        INFOPLIST_KEY_UIBackgroundModes: [bluetooth-central]
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        CODE_SIGNING_ALLOWED: NO
